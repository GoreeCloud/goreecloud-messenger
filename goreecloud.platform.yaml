schema_version: "0.2"

component:
  type: application
  id: goreecloud-messenger
  product_name: GoreeCloud Messenger
  repository: GoreeCloud/goreecloud-messenger

lifecycle: development
version: "0.1.0-dev"

supported_platforms:
  - server

api:
  versions:
    - v1
  endpoints:
    - name: data-message-submit
      url: /v1/data/messages
      purpose: POST an authenticated encrypted GoreeCloud Data message envelope.
    - name: data-conversation-messages
      url: /v1/data/conversations/{conversationID}/messages
      purpose: GET authorized encrypted Data messages for a conversation.
    - name: data-receipt-record
      url: /v1/data/messages/{messageID}/receipts
      purpose: POST an authenticated delivered or read receipt.
    - name: data-receipt-list
      url: /v1/data/messages/{messageID}/receipts
      purpose: GET authorized receipt state for a Data message.
    - name: data-attachment-submit
      url: /v1/data/attachments
      purpose: POST opaque encrypted attachment ciphertext.
    - name: data-attachment-get
      url: /v1/data/attachments/{attachmentID}
      purpose: GET an authorized encrypted attachment as JSON and base64.
    - name: data-attachment-ciphertext
      url: /v1/data/attachments/{attachmentID}/ciphertext
      purpose: GET exact authorized opaque attachment ciphertext bytes.
    - name: data-attachment-delete
      url: /v1/data/attachments/{attachmentID}
      purpose: DELETE an authorized encrypted attachment through the replay-safe tombstone path.
    - name: data-conversation-attachments
      url: /v1/data/conversations/{conversationID}/attachments
      purpose: GET authorized encrypted attachment metadata for a conversation.
    - name: data-typing-publish
      url: /v1/data/conversations/{conversationID}/typing
      purpose: POST optional participant-authorized content-free typing presence with the bounded process-local Development anti-flood guard.
    - name: data-typing-list
      url: /v1/data/conversations/{conversationID}/typing
      purpose: GET optional privacy-gated content-free typing presence.
    - name: data-typing-preferences-get
      url: /v1/data/conversations/{conversationID}/typing/preferences
      purpose: GET the authenticated participant's minimized typing privacy choices.
    - name: data-typing-preferences-put
      url: /v1/data/conversations/{conversationID}/typing/preferences
      purpose: PUT the authenticated participant's minimized typing privacy choices.
    - name: data-runtime-projection
      url: /v1/data/runtime
      purpose: GET the authenticated minimized Development runtime composition projection without sensitive dependency details.

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
    notes: The Messenger Development runtime has no accepted GoreeCloud Manager registration, lifecycle, deployment, or operational visibility integration.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - internal/api/typing_http.go
      - internal/api/typing_preferences_http.go
      - internal/service/typing_service.go
      - docs/development/typing-publish-rate-guard.md
      - docs/development/typing-publish-participant-cap.md
    notes: Typing presence is content-free and independently privacy-gated, and limiter state is ephemeral and minimized with global and per-participant reservation bounds, but accepted Privacy Shield integration, consent authority, and production privacy validation are not established.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - internal/api/data_runtime.go
      - internal/api/attachment_http.go
      - internal/service/typing_service.go
      - docs/development/typing-publish-rate-guard.md
      - docs/development/typing-publish-participant-cap.md
    notes: Messenger has authorization, fail-closed Development persistence, opaque ciphertext handling, minimized diagnostics, and a bounded process-local typing anti-flood guard with global and per-participant reservation ceilings, but accepted Wardveil Security integration and distributed production abuse-control validation are not established.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - USER-MANUAL.md
    notes: Messenger has durable single-node Development stores for selected state, but accepted backup, restore, recovery, portability, and continuity behavior for encrypted communication is not implemented.
  glaze_ui:
    result: applicable-migration-required
    version: null
    evidence:
      - README.md
    notes: The current repository is a server-first Development foundation and has no accepted user-facing Glaze client. The historical 2.2.0 target is superseded; any user-facing client must target and obtain application-specific acceptance against current Stable GLAZE UI V1.1 / 1.1.0.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - internal/api/data_runtime.go
    notes: The current Data API is application-local Development transport; canonical GoreeCloud Mesh registration, service identity, event contracts, capability publication, and runtime acceptance are not established.
    capabilities:
      - encrypted-data-messaging
      - delivery-read-receipts
      - opaque-encrypted-attachments
      - privacy-controlled-typing-presence
    dependencies:
      - goreecloud-identity
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - internal/api/http.go
      - internal/api/typing_preferences_http.go
    notes: HTTP handlers inject an Authenticator and derive acting identities from it, but production GoreeCloud Identity credential issuance, session validation, device identity, and username resolution are not implemented or accepted.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define and accept backup scope for production encrypted message and attachment persistence, required configuration, privacy choices, and cryptographic recovery dependencies.
      - Integrate approved Everkeep backup behavior before Stable or production-family acceptance.
  restore:
    required: true
    requirements:
      - Validate clean-target recovery of authorized durable communication state without exposing reusable key material or bypassing GoreeCloud Identity ownership.
      - Define cryptographic device and key recovery, failure, conflict, and rollback behavior before restore is claimed.
  export:
    required: true
    requirements:
      - Preserve encrypted content and accepted conversation semantics without unnecessarily exporting reusable key material.
      - Exclude ephemeral typing presence and all typing anti-flood reservation/timing state from durable export.
  portability:
    required: true
    requirements:
      - Preserve transport provenance without representing carrier and GoreeCloud Data transports as equivalent.
      - Make device and key migration behavior explicit and independently validated.
      - Preserve accepted edit, reply, thread, reaction, receipt, attachment, and deletion semantics where those capabilities are supported.
      - Place any privacy-preference portability under accepted Privacy Shield and Everkeep authority.

external_dependencies: []

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.1.0"
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.1.0
  provides:
    - messenger-data-http-api-v1

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - USER-MANUAL.md
    - docs/architecture.md
    - docs/security.md
    - docs/data-http-api.md
    - docs/development/typing-publish-rate-guard.md
    - docs/development/typing-publish-participant-cap.md
  blockers:
    - No accepted user-facing GLAZE UI V1.1 / 1.1.0 Messenger client exists in the current Development repository.
    - Production GoreeCloud Identity credential, session, device identity, and username-resolution integration are not established.
    - Accepted cryptographic session and key lifecycle are not established for production.
    - Wardveil Security integration and distributed production abuse-control acceptance are not established; current typing limits are process-local only.
    - Privacy Shield integration, consent authority, and accepted preference persistence are not established.
    - Everkeep integration plus accepted backup, restore, recovery, and encrypted-communication portability are not established.
    - GoreeCloud Mesh registration, service identity, capability publication, event contracts, and runtime acceptance are not established.
    - GoreeCloud Manager platform visibility and operational acceptance are not established.
    - Production deployment, release evidence, and Stable qualification remain outstanding.
