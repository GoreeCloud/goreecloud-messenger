schema_version: "1.0"
component:
  id: goreecloud.messenger
  product_name: GoreeCloud Messenger
  kind: application
  repository: GoreeCloud/goreecloud-messenger
  lifecycle: Development
  version: "0.1.0-dev"
  supported_platforms:
    - server
  user_facing: true
api:
  version: "v1"
  endpoints:
    - {id: data-message-submit, method: POST, path: /v1/data/messages, purpose: Submit an authenticated encrypted GoreeCloud Data message envelope.}
    - {id: data-conversation-messages, method: GET, path: /v1/data/conversations/{conversationID}/messages, purpose: List authorized encrypted Data messages for a conversation.}
    - {id: data-receipt-record, method: POST, path: /v1/data/messages/{messageID}/receipts, purpose: Record an authenticated delivered or read receipt.}
    - {id: data-receipt-list, method: GET, path: /v1/data/messages/{messageID}/receipts, purpose: List authorized receipt state for a Data message.}
    - {id: data-attachment-submit, method: POST, path: /v1/data/attachments, purpose: Submit opaque encrypted attachment ciphertext.}
    - {id: data-attachment-get, method: GET, path: /v1/data/attachments/{attachmentID}, purpose: Fetch an authorized encrypted attachment as JSON/base64.}
    - {id: data-attachment-ciphertext, method: GET, path: /v1/data/attachments/{attachmentID}/ciphertext, purpose: Download exact authorized opaque attachment ciphertext bytes.}
    - {id: data-attachment-delete, method: DELETE, path: /v1/data/attachments/{attachmentID}, purpose: Delete an authorized encrypted attachment through the replay-safe tombstone path.}
    - {id: data-conversation-attachments, method: GET, path: /v1/data/conversations/{conversationID}/attachments, purpose: List authorized encrypted attachment metadata for a conversation.}
    - {id: data-typing-publish, method: POST, path: /v1/data/conversations/{conversationID}/typing, purpose: Publish optional participant-authorized content-free typing presence.}
    - {id: data-typing-list, method: GET, path: /v1/data/conversations/{conversationID}/typing, purpose: Observe optional privacy-gated content-free typing presence.}
    - {id: data-typing-preferences-get, method: GET, path: /v1/data/conversations/{conversationID}/typing/preferences, purpose: Read the authenticated participant's minimized typing privacy choices.}
    - {id: data-typing-preferences-put, method: PUT, path: /v1/data/conversations/{conversationID}/typing/preferences, purpose: Update the authenticated participant's minimized typing privacy choices.}
    - {id: data-runtime-projection, method: GET, path: /v1/data/runtime, purpose: Return the authenticated minimized Development runtime composition projection without sensitive dependency details.}
glaze_ui:
  applicable: true
  required_version: "2.2.0"
  implemented_version: null
  migration_status: required
  evidence:
    - messenger-readme
platform_systems:
  manager:
    status: "Applicable — Nonconformant"
    justification: The Messenger Development runtime has no accepted GoreeCloud Manager registration, lifecycle, deployment, or operational visibility integration.
    evidence:
      - messenger-readme
  identity:
    status: "Applicable — Nonconformant"
    justification: HTTP handlers inject an Authenticator and derive acting identities from it, but production GoreeCloud Identity credential issuance, session validation, device identity, and username resolution are not implemented or accepted.
    evidence:
      - messenger-message-api-source
      - messenger-typing-preferences-source
  wardveil_security:
    status: "Applicable — Nonconformant"
    justification: Messenger has authorization, fail-closed persistence, opaque ciphertext, and minimized diagnostic safeguards, but these source controls do not establish accepted Wardveil Security integration.
    evidence:
      - messenger-data-runtime-source
      - messenger-attachment-api-source
      - messenger-ci-359
  privacy_shield:
    status: "Applicable — Nonconformant"
    justification: Typing presence is content-free and independently privacy-gated and durable preference storage is hardened, but production Privacy Shield integration, consent authority, and accepted preference persistence are not established.
    evidence:
      - messenger-typing-source
      - messenger-typing-preferences-source
      - messenger-ci-359
  everkeep:
    status: "Applicable — Nonconformant"
    justification: Messenger has durable single-node Development stores for selected state, but accepted backup, restore, recovery, portability, and continuity behavior for encrypted communication is not implemented.
    evidence:
      - messenger-readme
  mesh:
    status: "Applicable — Nonconformant"
    justification: The current Data API is application-local Development transport; canonical GoreeCloud Mesh registration, service identity, event contracts, and compatibility acceptance are not established.
    evidence:
      - messenger-data-runtime-source
  glaze_ui:
    status: "Applicable — Migration Required"
    justification: The current repository is a server/service foundation and does not yet contain an accepted user-facing Glaze UI 2.2.0 Messenger client.
    evidence:
      - messenger-readme
mesh:
  registration: required
  capabilities:
    - encrypted-data-messaging
    - delivery-read-receipts
    - opaque-encrypted-attachments
    - privacy-controlled-typing-presence
  dependencies:
    - goreecloud.identity
  published_events: []
  consumed_events: []
  evidence: []
health:
  liveness: []
  readiness: []
recovery:
  backup_required: true
  backup_status: required_missing
  restore_required: true
  restore_status: required_missing
  last_verified_restore: null
  recovery_dependencies:
    - production encrypted message persistence
    - production encrypted attachment persistence
    - production GoreeCloud Identity device and session state
    - accepted cryptographic device and key lifecycle
    - accepted Privacy Shield preference authority
    - accepted Everkeep recovery integration
  documentation:
    - README.md
    - USER-MANUAL.md
    - docs/architecture.md
    - docs/security.md
    - docs/data-http-api.md
  evidence:
    - messenger-readme
    - messenger-user-manual
data_portability:
  export_capability: unknown
  export_formats: []
  last_export_validation: null
  portability_requirements:
    - preserve conversation and message transport provenance without representing carrier and GoreeCloud Data transports as equivalent
    - preserve encrypted content without exporting reusable key material unnecessarily
    - make device and key migration behavior explicit and independently validated
    - preserve delete-for-everyone, edit, reply, thread, reaction, receipt, and attachment semantics where those capabilities are accepted
    - exclude ephemeral typing presence from durable exports
    - place any privacy preference portability under accepted Privacy Shield and Everkeep authority
  evidence:
    - messenger-readme
external_dependencies: []
compatibility:
  platform_releases: []
  api_requirements:
    - All Data endpoints require an injected authenticated-user boundary before authorized operations are exposed.
    - GoreeCloud Data messages claiming E2EE must remain encrypted envelopes and must not silently downgrade to SMS, MMS, or RCS.
    - Optional typing routes must not be enabled merely by constructing the base Data runtime.
    - Typing preference request bodies must not accept an acting user identity field.
  schema_requirements:
    - goreecloud.platform/1.0
    - messenger Data HTTP API v1
  component_requirements:
    - production GoreeCloud Identity integration before Stable
    - accepted cryptographic session and key lifecycle before Stable
    - Wardveil Security and Privacy Shield accepted integration before Stable
    - Everkeep accepted backup and restore integration before Stable
    - GoreeCloud Mesh registration before platform acceptance
    - Glaze UI 2.2.0 client implementation and acceptance before user-facing Stable
conformance:
  declared_state: migration_required
  stable_eligible: false
  checks:
    - {id: glaze-ui, mandatory: true, status: pending, evidence: [messenger-readme], note: "No accepted Glaze UI 2.2.0 client exists in the current Development repository."}
    - {id: goreecloud-identity, mandatory: true, status: pending, evidence: [messenger-message-api-source, messenger-typing-preferences-source], note: "Injected authentication is not production GoreeCloud Identity integration."}
    - {id: wardveil-security, mandatory: true, status: pending, evidence: [messenger-data-runtime-source, messenger-attachment-api-source, messenger-ci-359]}
    - {id: privacy-shield, mandatory: true, status: pending, evidence: [messenger-typing-source, messenger-typing-preferences-source, messenger-ci-359]}
    - {id: everkeep-recovery, mandatory: true, status: pending, evidence: [messenger-readme]}
    - {id: mesh-registration, mandatory: true, status: pending, evidence: [messenger-data-runtime-source]}
    - {id: api-compatibility, mandatory: true, status: pass, evidence: [messenger-message-api-source, messenger-attachment-api-source, messenger-typing-source, messenger-typing-preferences-source, messenger-data-runtime-source, messenger-ci-359], note: "The Development v1 HTTP route surface is explicit, authenticated, source-tested, and documented; this does not establish production deployment acceptance."}
    - {id: accessibility, mandatory: true, status: pending, evidence: [], note: "No accepted user-facing client is present yet."}
    - {id: platform-acceptance, mandatory: true, status: pending, evidence: []}
    - {id: backup, mandatory: true, status: pending, evidence: [messenger-readme]}
    - {id: restore, mandatory: true, status: pending, evidence: [messenger-readme]}
    - {id: export-portability, mandatory: true, status: pending, evidence: [messenger-readme]}
    - {id: security-validation, mandatory: true, status: pending, evidence: [messenger-ci-359], note: "Security-oriented source tests exist, but accepted Wardveil/production security validation is pending."}
    - {id: privacy-validation, mandatory: true, status: pending, evidence: [messenger-typing-preferences-source, messenger-ci-359], note: "Privacy-minimized typing controls are tested, but accepted Privacy Shield validation is pending."}
    - {id: required-documentation, mandatory: true, status: pass, evidence: [messenger-readme, messenger-user-manual]}
    - {id: required-tests, mandatory: true, status: pass, evidence: [messenger-ci-359], note: "Messenger Foundation #359 passed format, go vet, and go test at the current typing-privacy hardening head."}
    - {id: release-evidence, mandatory: true, status: pending, evidence: [], note: "No production release/deployment acceptance exists for the current Messenger Development runtime."}
