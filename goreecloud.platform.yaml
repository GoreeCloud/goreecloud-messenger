      - client/android/app/src/main/kotlin/com/goreecloud/messenger/client/MessengerClientActivity.kt
    notes: The native Android Development client now targets current Stable GLAZE UI V1.3 / 1.3.0 Adaptive Resonance at exact Stable integration revision fc7cc91d2eace8da2371371c2855c24cbcb326a1. It retains the inherited neutral Light/Dark V1.2 material foundation, records the V1.3 adaptive contract and Stable entrypoints, preserves 48/56 dp interaction floors, and records V1.2.0 as rollback baseline. Complete rendered, interaction, accessibility, adaptive/form-factor, representative-device, workflow, performance, rollback, Human Visual Excellence, release, and production acceptance remain independent gates.
  mesh:
