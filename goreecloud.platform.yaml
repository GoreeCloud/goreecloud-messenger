      - docs/development/e2ee-authority-acceptance.md
      - docs/development/typing-publish-rate-guard.md
      - docs/development/typing-publish-participant-cap.md
    notes: Messenger has authorization, fail-closed Development persistence, opaque ciphertext handling, minimized diagnostics, categorical fail-closed readiness, and a bounded process-local typing anti-flood guard. The optional Identity resolution boundary requires Messenger-user authentication, strict bounded JSON input, rejects a client-authored service identity, redacts provider failures, validates provider output, and is absent until explicitly composed. It does not implement a live Identity client, service credential, distributed account-discovery rate limiting, or accepted Wardveil abuse controls. The disconnected Android client rejects carrier E2EE claims, network/storage authority, unscoped conversation readiness, caller-preassembled positive send readiness, and transport success unless independent authority prerequisites are verified. Its protocol-neutral E2EE acceptance seam additionally rejects a bare active-E2EE claim unless implementation review is accepted, local cryptographic device identity is enrolled, the conversation session is established, key lifecycle is current, and exact canonical conversation scope matches. The source guard blocks direct java.security/javax.crypto implementation markers on this acceptance-only line. No concrete E2EE protocol is selected or implemented, no real key/session authority exists, and accepted Wardveil Security integration remains blocked.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - USER-MANUAL.md
      - client/android/README.md
    notes: Messenger has durable single-node Development stores for selected server state, while the Android Development client deliberately persists no message state; accepted backup, restore, recovery, portability, and continuity behavior for encrypted communication is not implemented.
