    notes: Server HTTP handlers inject an Authenticator and derive acting Messenger user identities from it. The optional exact-handle consumer boundary is pinned to GoreeCloud Identity Draft PR #5 at exact head 5904a44997b90cc44f5d196620bb7e189fea0eeb and preserves the Draft contract's service-owned requester identity, exact-handle-only semantics, uniform privacy-sensitive unresolved result, and minimized successful projection. The route is absent until explicitly composed, and the repository contains no production Identity resolver, network client, service credential, accepted service-principal authentication profile, deployed consumer directory, device identity integration, or production session authority. The native Android client separately defines a narrow Identity-session state provider seam but composes no production provider. Production GoreeCloud Identity credential issuance, session validation, device identity, application authorization integration, service authentication, and username-resolution deployment are not implemented or accepted.

health:
  health_endpoint: /healthz
  readiness_endpoint: /readyz

continuity:
  backup:
    required: true
    requirements:
      - Define and accept backup scope for production encrypted message and attachment persistence, required configuration, privacy choices, and cryptographic recovery dependencies.
      - Integrate approved Everkeep backup behavior before Stable or production-family acceptance.
  restore:
    required: true
    requirements:
      - Validate clean-target recovery of authorized durable communication state without exposing reusable key material or bypassing GoreeCloud Identity ownership.
      - Define cryptographic device and key recovery, failure, conflict, and rollback behavior before restore is claimed.
  export:
    required: true
    requirements:
      - Preserve encrypted content and accepted conversation semantics without unnecessarily exporting reusable key material.
      - Exclude ephemeral typing presence and all typing anti-flood reservation/timing state from durable export.
  portability:
    required: true
    requirements:
      - Preserve transport provenance without representing carrier and GoreeCloud Data transports as equivalent.
      - Make device and key migration behavior explicit and independently validated.
      - Preserve accepted edit, reply, thread, reaction, receipt, attachment, and deletion semantics where those capabilities are supported.
      - Place any privacy-preference portability under accepted Privacy Shield and Everkeep authority.

