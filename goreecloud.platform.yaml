schema_version: "0.2"

component:
  type: application
  id: goreecloud-messenger
  product_name: GoreeCloud Messenger
  repository: GoreeCloud/goreecloud-messenger

lifecycle: development
version: "0.1.0-dev"

supported_platforms:
  - server
  - android

api:
  versions:
    - v1
  endpoints:
    - name: data-message-submit
      url: /v1/data/messages
      purpose: POST an authenticated encrypted GoreeCloud Data message envelope.
    - name: data-conversation-messages
      url: /v1/data/conversations/{conversationID}/messages
      purpose: GET authorized encrypted Data messages for a conversation.
    - name: data-receipt-record
      url: /v1/data/messages/{messageID}/receipts
      purpose: POST an authenticated delivered or read receipt.
    - name: data-receipt-list
      url: /v1/data/messages/{messageID}/receipts
      purpose: GET authorized receipt state for a Data message.
    - name: data-attachment-submit
      url: /v1/data/attachments
      purpose: POST opaque encrypted attachment ciphertext.
    - name: data-attachment-get
      url: /v1/data/attachments/{attachmentID}
      purpose: GET an authorized encrypted attachment as JSON and base64.
    - name: data-attachment-ciphertext
      url: /v1/data/attachments/{attachmentID}/ciphertext
      purpose: GET exact authorized opaque attachment ciphertext bytes.
    - name: data-attachment-delete
      url: /v1/data/attachments/{attachmentID}
      purpose: DELETE an authorized encrypted attachment through the replay-safe tombstone path.
    - name: data-conversation-attachments
      url: /v1/data/conversations/{conversationID}/attachments
      purpose: GET authorized encrypted attachment metadata for a conversation.
    - name: data-typing-publish
      url: /v1/data/conversations/{conversationID}/typing
      purpose: POST optional participant-authorized content-free typing presence with the bounded process-local Development anti-flood guard.
    - name: data-typing-list
      url: /v1/data/conversations/{conversationID}/typing
      purpose: GET optional privacy-gated content-free typing presence.
    - name: data-typing-preferences-get
      url: /v1/data/conversations/{conversationID}/typing/preferences
      purpose: GET the authenticated participant's minimized typing privacy choices.
    - name: data-typing-preferences-put
      url: /v1/data/conversations/{conversationID}/typing/preferences
      purpose: PUT the authenticated participant's minimized typing privacy choices.
    - name: data-runtime-projection
      url: /v1/data/runtime
      purpose: GET the authenticated minimized Development runtime composition projection without sensitive dependency details.
    - name: runtime-health
      url: /healthz
      purpose: GET categorical process liveness without authentication or dependency detail.
    - name: runtime-readiness
      url: /readyz
      purpose: GET categorical fail-closed readiness; returns unavailable unless an explicit runtime readiness authority is composed and succeeds.

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - internal/api/runtime_health.go
    notes: The Messenger Development runtime exposes categorical health/readiness routes suitable for later platform visibility integration, but it has no accepted GoreeCloud Manager registration, lifecycle, deployment, or operational visibility integration.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - internal/api/typing_http.go
      - internal/api/typing_preferences_http.go
      - internal/service/typing_service.go
      - internal/api/runtime_health.go
      - client/android/app/src/main/kotlin/com/goreecloud/messenger/client/CommunicationProvenance.kt
      - docs/development/typing-publish-rate-guard.md
      - docs/development/typing-publish-participant-cap.md
    notes: Typing presence is content-free and independently privacy-gated, limiter state is ephemeral and minimized with global and per-participant reservation bounds, the Android Development client exposes no live user data or message authority, and public health/readiness responses expose only categorical state; accepted Privacy Shield integration, consent authority, and production privacy validation are not established.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - internal/api/data_runtime.go
      - internal/api/attachment_http.go
      - internal/api/runtime_health.go
      - internal/api/runtime_health_test.go
      - internal/service/typing_service.go
      - client/android/app/src/main/kotlin/com/goreecloud/messenger/client/CommunicationProvenance.kt
      - scripts/check_android_client_boundary.py
      - docs/development/typing-publish-rate-guard.md
      - docs/development/typing-publish-participant-cap.md
    notes: Messenger has authorization, fail-closed Development persistence, opaque ciphertext handling, minimized diagnostics, categorical fail-closed readiness, a bounded process-local typing anti-flood guard, and a disconnected Android client whose source boundary rejects carrier E2EE claims and network/storage authority; accepted Wardveil Security integration and distributed production abuse-control validation are not established.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - USER-MANUAL.md
      - client/android/README.md
    notes: Messenger has durable single-node Development stores for selected server state, while the Android Development client deliberately persists no message state; accepted backup, restore, recovery, portability, and continuity behavior for encrypted communication is not implemented.
  glaze_ui:
    result: applicable-migration-required
    version: null
    evidence:
      - README.md
      - client/android/README.md
      - client/android/app/src/main/kotlin/com/goreecloud/messenger/client/GlazeClientTokens.kt
      - client/android/app/src/main/kotlin/com/goreecloud/messenger/client/MessengerClientActivity.kt
    notes: A first native Android Development client now exists and builds, but it is only a disconnected source/design mapping and has no application-specific rendered or accessibility acceptance. The declared current Stable requirement remains GLAZE UI V1.1 / 1.1.0, whose known immutable import-closure defect prevents accepted downstream conformance; a corrected immutable Stable release, explicit re-pin, and fresh Messenger client acceptance remain required.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - internal/api/data_runtime.go
      - internal/api/runtime_health.go
    notes: The current Data API is application-local Development transport; canonical GoreeCloud Mesh registration, service identity, event contracts, capability publication, and runtime acceptance are not established.
    capabilities:
      - encrypted-data-messaging
      - delivery-read-receipts
      - opaque-encrypted-attachments
      - privacy-controlled-typing-presence
    dependencies:
      - goreecloud-identity
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - internal/api/http.go
      - internal/api/typing_preferences_http.go
      - client/android/README.md
    notes: Server HTTP handlers inject an Authenticator and derive acting identities from it, while the native Android Development client intentionally has no account/session integration; production GoreeCloud Identity credential issuance, session validation, device identity, and username resolution are not implemented or accepted.

health:
  health_endpoint: /healthz
  readiness_endpoint: /readyz

continuity:
  backup:
    required: true
    requirements:
      - Define and accept backup scope for production encrypted message and attachment persistence, required configuration, privacy choices, and cryptographic recovery dependencies.
      - Integrate approved Everkeep backup behavior before Stable or production-family acceptance.
  restore:
    required: true
    requirements:
      - Validate clean-target recovery of authorized durable communication state without exposing reusable key material or bypassing GoreeCloud Identity ownership.
      - Define cryptographic device and key recovery, failure, conflict, and rollback behavior before restore is claimed.
  export:
    required: true
    requirements:
      - Preserve encrypted content and accepted conversation semantics without unnecessarily exporting reusable key material.
      - Exclude ephemeral typing presence and all typing anti-flood reservation/timing state from durable export.
  portability:
    required: true
    requirements:
      - Preserve transport provenance without representing carrier and GoreeCloud Data transports as equivalent.
      - Make device and key migration behavior explicit and independently validated.
      - Preserve accepted edit, reply, thread, reaction, receipt, attachment, and deletion semantics where those capabilities are supported.
      - Place any privacy-preference portability under accepted Privacy Shield and Everkeep authority.

external_dependencies: []

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.1.0"
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.1.0
  provides:
    - messenger-data-http-api-v1

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - USER-MANUAL.md
    - docs/architecture.md
    - docs/security.md
    - docs/data-http-api.md
    - internal/api/runtime_health.go
    - internal/api/runtime_health_test.go
    - client/android/README.md
    - client/android/app/src/main/kotlin/com/goreecloud/messenger/client/CommunicationProvenance.kt
    - client/android/app/src/main/kotlin/com/goreecloud/messenger/client/GlazeClientTokens.kt
    - client/android/app/src/main/kotlin/com/goreecloud/messenger/client/MessengerClientActivity.kt
    - scripts/check_android_client_boundary.py
    - docs/development/typing-publish-rate-guard.md
    - docs/development/typing-publish-participant-cap.md
  blockers:
    - The native Android Development client is disconnected and has no accepted current-Stable GLAZE UI rendered/accessibility/device acceptance or real Data messaging integration.
    - Production GoreeCloud Identity credential, session, device identity, and username-resolution integration are not established.
    - Accepted cryptographic session and key lifecycle are not established for production or the Android client.
    - Wardveil Security integration and distributed production abuse-control acceptance are not established; current typing limits are process-local only.
    - Privacy Shield integration, consent authority, and accepted preference persistence are not established.
    - Everkeep integration plus accepted backup, restore, recovery, and encrypted-communication portability are not established.
    - GoreeCloud Mesh registration, service identity, capability publication, event contracts, and runtime acceptance are not established.
    - GoreeCloud Manager platform visibility and operational acceptance are not established; the health/readiness routes are only an application-local Development foundation.
    - Production deployment, protected signing/provenance, representative-device acceptance, release evidence, and Release Candidate/Stable qualification remain outstanding.
