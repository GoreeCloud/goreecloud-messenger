name: Messenger Android Client

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '8.11.1'

      - name: Validate Development client authority boundary
        run: python3 scripts/check_android_client_boundary.py

      - name: Run client unit tests
        run: gradle -p client/android :app:testDebugUnitTest --stacktrace

      - name: Resolve Development Android debug runtime dependencies
        run: |
          mkdir -p client/android/app/build/outputs/dependency-evidence
          gradle -p client/android :app:dependencies \
            --configuration debugRuntimeClasspath \
            --console=plain \
            > client/android/app/build/outputs/dependency-evidence/gradle-debug-runtime-dependencies.txt

      - name: Generate exact-source Development Android SBOM
        env:
          GOREECLOUD_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/generate_android_dependency_sbom.py \
            --report client/android/app/build/outputs/dependency-evidence/gradle-debug-runtime-dependencies.txt \
            --output client/android/app/build/outputs/dependency-evidence/android-debug-runtime.cdx.json \
            --checksum-output client/android/app/build/outputs/dependency-evidence/android-debug-runtime.cdx.json.sha256

      - name: Build client debug APK
        run: gradle -p client/android :app:assembleDebug --stacktrace

      - name: Generate exact Development APK build evidence
        env:
          GOREECLOUD_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/generate_android_build_evidence.py \
            --apk client/android/app/build/outputs/apk/debug/app-debug.apk \
            --output client/android/app/build/outputs/apk/debug/evidence/build-evidence.json \
            --checksum-output client/android/app/build/outputs/apk/debug/evidence/app-debug.apk.sha256 \
            --signature-output client/android/app/build/outputs/apk/debug/evidence/signature-evidence.txt

      - name: Retain Development debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: goreecloud-messenger-android-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Retain Development APK evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: goreecloud-messenger-android-debug-evidence
          path: client/android/app/build/outputs/apk/debug/evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Retain Development dependency evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: goreecloud-messenger-android-debug-dependency-evidence
          path: client/android/app/build/outputs/dependency-evidence/
          if-no-files-found: error
          retention-days: 30

  android-client-emulator:
    needs: android-client
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify disconnected Messenger shell on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          script: gradle -p client/android --no-daemon :app:connectedDebugAndroidTest --stacktrace
